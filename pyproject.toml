[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-assistant"
version = "0.1.0"
description = "Asistente modular con modelos intercambiables"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["boto3>=1.40", "jsonschema>=4.19,<5"]

[tool.setuptools.packages.find]
where = ["src"]
